name: publish-release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(grep '^flowGraphVersion=' gradle.properties | cut -d= -f2-)"
          test "${GITHUB_REF_NAME}" = "${VERSION}"
      - run: gradle clean test buildPlugin
      - run: gradle -p instrumentation clean build
      - name: Verify the artifact JitPack will publish
        run: >-
          gradle -p instrumentation :flowgraph-runtime:publishToMavenLocal
          -Pgroup=com.github.elivity -Partifact=flow-graph -Pversion=${GITHUB_REF_NAME:-0.18.6}
      - run: gradle -p instrumentation :flowgraph-gradle-plugin:publishPlugins --validate-only

  publish-gradle-plugin:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Publish instrumentation plugin to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle -p instrumentation :flowgraph-gradle-plugin:publishPlugins

  publish-marketplace:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Publish Android Studio plugin to JetBrains Marketplace
        run: gradle publishPlugin -PintellijPlatformPublishingToken='${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}'

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-gradle-plugin, publish-marketplace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: gradle buildPlugin
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            build/distributions/*.zip

name: publish-release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(grep '^flowGraphVersion=' gradle.properties | cut -d= -f2-)"
          test "${GITHUB_REF_NAME}" = "${VERSION}"
      - run: gradle clean test buildPlugin
      - name: Verify compatibility with Android Studio Rabbit 1
        run: gradle verifyPlugin
      - run: gradle -p instrumentation clean build
      - name: Verify both JitPack publications
        shell: bash
        run: |
          VERSION="$(sed -n 's/^flowGraphVersion=//p' gradle.properties)"
          test -n "$VERSION"
          gradle -p instrumentation :flowgraph-runtime:publishToMavenLocal \
            :flowgraph-gradle-plugin:publishToMavenLocal -PflowGraphJitPack=true
          for MODULE in flowgraph-runtime flowgraph-gradle-plugin; do
            BASE="$HOME/.m2/repository/com/github/elivity/flow-graph/$MODULE/$VERSION/$MODULE-$VERSION"
            test -s "$BASE.jar"
            test -s "$BASE.pom"
          done
          unzip -p "$HOME/.m2/repository/com/github/elivity/flow-graph/flowgraph-gradle-plugin/$VERSION/flowgraph-gradle-plugin-$VERSION.jar" \
            flowgraph-instrumentation.properties | grep -Fx "runtimeDependency=com.github.elivity.flow-graph:flowgraph-runtime:$VERSION"
      - run: gradle -p instrumentation :flowgraph-gradle-plugin:publishPlugins --validate-only

  publish-gradle-plugin:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Publish instrumentation plugin to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle -p instrumentation :flowgraph-gradle-plugin:publishPlugins

  publish-marketplace:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Publish Android Studio plugin to JetBrains Marketplace
        run: gradle publishPlugin -PintellijPlatformPublishingToken='${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}'

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-gradle-plugin, publish-marketplace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: gradle buildPlugin
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            build/distributions/*.zip

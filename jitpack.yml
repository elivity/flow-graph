jdk:
  - openjdk17

# Use the pinned root Gradle wrapper rather than installing another Gradle version.
# One Git tag publishes the plugin implementation AND its matching debug runtime.
# Both modules install under com.github.elivity.flow-graph:<module>:<tag>.
install:
  - ./gradlew -p instrumentation :flowgraph-runtime:publishToMavenLocal :flowgraph-gradle-plugin:publishToMavenLocal -PflowGraphJitPack=true --no-daemon --stacktrace --info

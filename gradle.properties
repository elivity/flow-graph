flowGraphVersion=0.20.12
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
# Marketplace publishing. Keep the token outside source control; this empty value only
# allows the Gradle DSL to resolve when no token was supplied.
intellijPlatformPublishingToken=

# Public project metadata.
flowGraphProjectUrl=https://github.com/elivity/flow-graph
flowGraphScmUrl=https://github.com/elivity/flow-graph.git
flowGraphDeveloperId=elivity
flowGraphDeveloperName=OskiApps
flowGraphLicenseName=MIT License
flowGraphLicenseUrl=https://github.com/elivity/flow-graph/blob/main/LICENSE

# Both instrumentation modules are published from one JitPack Git tag.
# JitPack multi-module artifact coordinates use the repository-qualified group.
flowGraphJitPackGroup=com.github.elivity.flow-graph
flowGraphRuntimeArtifact=flowgraph-runtime
flowGraphGradlePluginArtifact=flowgraph-gradle-plugin
